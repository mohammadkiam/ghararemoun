/* =========================
تاریخ شمسی
========================= */

const faCalendar=
new Intl.DateTimeFormat(
"fa-IR-u-ca-persian-nu-latn",
{
year:"numeric",
month:"numeric",
day:"numeric"
}
);

function gregorianToJalali(y,m,d){

const parts=
faCalendar.formatToParts(
new Date(y,m-1,d)
);

const get=t=>
Number(
parts.find(x=>x.type===t)?.value
);

return{
jy:get("year"),
jm:get("month"),
jd:get("day")
};
}

const jalaliIsoCache=new Map();

function jalaliDateToISO(jy,jm,jd){

const key=`${jy}-${jm}-${jd}`;

if(jalaliIsoCache.has(key))
return jalaliIsoCache.get(key);

let gy=jy+621;

let guess=
new Date(
Date.UTC(
gy,
2,
20
)
);

for(let i=-10;i<=380;i++){

const x=
new Date(
guess.getTime()+
i*86400000
);

const j=
gregorianToJalali(
x.getUTCFullYear(),
x.getUTCMonth()+1,
x.getUTCDate()
);

if(
j.jy===jy &&
j.jm===jm &&
j.jd===jd
){

const iso=
`${x.getUTCFullYear()}-${String(
x.getUTCMonth()+1
).padStart(2,"0")}-${String(
x.getUTCDate()
).padStart(2,"0")}`;

jalaliIsoCache.set(key,iso);

return iso;
}
}

throw new Error("تبدیل تاریخ انجام نشد.");
}

function isoToJalali(iso){

const[
y,
m,
d
]=iso.slice(0,10)
.split("-")
.map(Number);

return gregorianToJalali(y,m,d);
}

function jalaliMonthDays(y,m){

if(m>=1 && m<=6)
return 31;

if(m>=7 && m<=11)
return 30;

const a=jalaliDateToISO(y,12,1);
const b=jalaliDateToISO(y+1,1,1);

return Math.round(
(Date.parse(b)-Date.parse(a))/86400000
);
}

function todayJalali(){

const d=new Date();

return gregorianToJalali(
d.getFullYear(),
d.getMonth()+1,
d.getDate()
);
}

const months=[
"فروردین",
"اردیبهشت",
"خرداد",
"تیر",
"مرداد",
"شهریور",
"مهر",

"دی",
"بهمن",
"اسفند"
];

const weekdays=[
"ش","ی","د","س","چ","پ","ج"
];

function jalaliDateLabel(iso){

const j=isoToJalali(iso);

return `${j.jd} ${months[j.jm-1]} ${j.jy}`;
}

function relativeTime(iso){

if(!iso)return "";

const d=new Date(iso);

const s=
Math.floor(
(Date.now()-d.getTime())/1000
);

if(s<60)return "همین الان";

if(s<3600)
return `${Math.floor(s/60)} دقیقه پیش`;

if(s<86400)
return `${Math.floor(s/3600)} ساعت پیش`;

if(s<604800)
return `${Math.floor(s/86400)} روز پیش`;

return d.toLocaleDateString("fa-IR");
}

function chatTime(iso){

const d=new Date(iso);

return d.toLocaleTimeString("fa-IR",{
hour:"2-digit",
minute:"2-digit"
});
}

async function signup(){

hideMessage();

const displayName=$("displayName")?.value.trim();
const username=$("username")?.value.trim().toLowerCase();
const password=$("password")?.value;

if(!displayName||!username||!password)
return showMessage("همه فیلدها رو کامل کن.");

if(username.length<3)
return showMessage("نام کاربری حداقل ۳ حرف باشه.");

if(password.length<6)
return showMessage("رمز عبور حداقل ۶ کاراکتر باشه.");

showLoading();

try{

const{data,error}=await withTimeout(
supabaseClient.auth.signUp({
email:username+"@gharamoon.local",
password,
options:{
data:{
username,
display_name:displayName
}
}
})
);

if(error)throw error;

if(data.session&&data.user){

currentUser=data.user;

await loadProfile();

renderApp();

hideLoading();

return;
}

hideLoading();

renderAuth("login");

showMessage("ثبت‌نام انجام شد. حالا وارد حسابت شو.");

}catch(e){

hideLoading();

renderAuth("signup");

showMessage(e.message||"ثبت‌نام انجام نشد.");
}
}

async function login(){

hideMessage();

const username=$("username")?.value.trim().toLowerCase();
const password=$("password")?.value;

if(!username||!password)
return showMessage("نام کاربری و رمز عبور رو وارد کن.");

showLoading();

try{

const{data:emailData,error:emailError}=await withTimeout(
supabaseClient.rpc("get_login_email",{
p_username:username
})
);

if(emailError)throw emailError;

if(!emailData)
throw new Error("نام کاربری پیدا نشد.");

const{data,error}=await withTimeout(
supabaseClient.auth.signInWithPassword({
email:emailData,
password
})
);

if(error)throw error;

currentUser=data.user;

await loadProfile();

renderApp();

hideLoading();

}catch(e){

hideLoading();

renderAuth("login");

showMessage(e.message||"ورود انجام نشد.");
}
}

async function loadProfile(){

if(!currentUser)
throw new Error("کاربر وارد نشده است.");

const{data,error}=await withTimeout(
supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle()
);

if(error)throw error;

if(!data)
throw new Error("پروفایل کاربر پیدا نشد.");

currentProfile=data;
}

async function getRequestsCount(){

supabaseClient
.from("friendships")
.select("id",{count:"exact",head:true})
.eq("receiver_id",currentUser.id)
.eq("status","pending"),

supabaseClient
.from("hangout_requests")
.select("id",{count:"exact",head:true})
.eq("receiver_id",currentUser.id)

async function searchFriend(){

const username=$("friendSearch").value.trim().toLowerCase();

if(!username)return;

box.innerHTML=
`<div class="empty">در حال جستجو...</div>`;

const{data,error}=await supabaseClient
.from("profiles")
.select("id,display_name,username")
.eq("username",username)
.maybeSingle();

if(error)
return box.innerHTML=
`<div class="empty">${escapeHtml(error.message)}</div>`;

if(!data)
return box.innerHTML=
`<div class="empty">کاربری پیدا نشد.</div>`;

if(data.id===currentUser.id)
return box.innerHTML=
`<div class="empty">این خودتی 😄</div>`;

const{data:existing}=await supabaseClient
.from("friendships")
.select("*")
.or(
`and(requester_id.eq.${currentUser.id},receiver_id.eq.${data.id}),and(requester_id.eq.${data.id},receiver_id.eq.${currentUser.id})`
)
.maybeSingle();

class="small-btn purple-btn"

افزودن
</button>
`;

}else if(existing.status==="accepted"){

</span>
`;

}else if(existing.requester_id===currentUser.id){

action=`
<span class="username">
درخواست ارسال شده
</span>
`;

}else{

action=`
<button
class="small-btn success-btn"
onclick="acceptFriend('${data.id}')">
قبول
</button>

<button
class="small-btn danger-btn"
onclick="rejectFriend('${data.id}')">
رد
</button>
`;
}

box.innerHTML=`

<div class="friend-item">

<div class="row">

<div>

<div class="name">
${escapeHtml(data.display_name)}
</div>

<div class="username">
@${escapeHtml(data.username)}
</div>

</div>

${action}
</div>

</div>

</div>
`;
}

async function loadFriends(){

const box=$("friendsList");

const{data,error}=await supabaseClient
.from("friendships")
.select("*")
.eq("status","accepted")
.or(
`requester_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
);

if(error)
return box.innerHTML=
`<div class="empty">${escapeHtml(error.message)}</div>`;

if(!data?.length)
return box.innerHTML=
`<div class="empty">هنوز دوستی نداری.</div>`;

const ids=data.map(
f=>f.requester_id===currentUser.id
?f.receiver_id
:f.requester_id
);

const{data:profiles}=await supabaseClient
.from("profiles")
.select("id,display_name,username")
.in("id",ids);

const unreadMap={};

await Promise.all(
(ids||[]).map(async id=>{
unreadMap[id]=await getUnreadFromFriend(id);
})
);

box.innerHTML=
(profiles||[])
.map(p=>{

const unread=unreadMap[p.id]||0;

return`

<div class="friend-item">

<div class="row">

<div>

<div class="name">
${escapeHtml(p.display_name)}
</div>

<div class="username">
@${escapeHtml(p.username)}
</div>

</div>

<div class="button-group">

<button
class="small-btn purple-btn"
onclick="openFriendCalendar('${p.id}','${escapeHtml(p.display_name)}')">
تقویم
</button>

<button
class="small-btn purple-btn"
onclick="openChat('${p.id}','${escapeHtml(p.display_name)}')">
💬 چت
${unread>0
?`<span class="unread-badge">${unread}</span>`
:""}
</button>

</div>

</div>

</div>
`;
})
.join("");
}

)

}

async function loadChatMessages(){

const box=$("chatMessages");

if(!box)return;

const{data,error}=await supabaseClient
.from("messages")
.select(
"id,sender_id,receiver_id,body,created_at,is_read"
)
.or(
`and(sender_id.eq.${currentUser.id},receiver_id.eq.${chatPartnerId}),and(sender_id.eq.${chatPartnerId},receiver_id.eq.${currentUser.id})`
)
.order("created_at",{ascending:true});

if(error){

box.innerHTML=`
<div class="chat-empty">
${escapeHtml(error.message)}
</div>
`;

return;
}

if(!data?.length){

box.innerHTML=`
<div class="chat-empty">
هنوز پیامی بین شما رد و بدل نشده.<br>
اولین پیام رو بفرست 👋
</div>
`;

return;
}

renderChatMessages(data);
}

function renderChatMessages(messages){

const box=$("chatMessages");

if(!box)return;

box.innerHTML="";

let lastDay="";

messages.forEach(message=>{

const day=new Date(message.created_at)
.toLocaleDateString("fa-IR");

if(day!==lastDay){

const dateEl=document.createElement("div");

dateEl.className="chat-date";

dateEl.textContent=day;

box.appendChild(dateEl);

lastDay=day;
}

appendChatMessage(message,false);
});

scrollChatToBottom();
}

function appendChatMessage(message,scroll=true){

const box=$("chatMessages");

if(!box)return;

const empty=box.querySelector(".chat-empty");

if(empty)
empty.remove();

const mine=
message.sender_id===currentUser.id;

const row=document.createElement("div");

row.className=
"chat-row "+
(mine?"mine":"theirs");

row.dataset.messageId=message.id;

const bubble=document.createElement("div");

bubble.className=
"chat-bubble "+
(mine?"mine":"theirs");

bubble.innerHTML=`
<div>${escapeHtml(message.body)}</div>
<div class="chat-time">
${chatTime(message.created_at)}
</div>
`;

row.appendChild(bubble);

box.appendChild(row);

if(scroll)
scrollChatToBottom();
}

function scrollChatToBottom(){

const box=$("chatMessages");

if(!box)return;

requestAnimationFrame(()=>{
box.scrollTop=box.scrollHeight;
});
}

async function sendChatMessage(){

const input=$("chatInput");
const button=$("chatSendButton");

if(!input||!chatPartnerId)return;

const body=input.value.trim();

if(!body)return;

if(body.length>2000)
return alert("پیام خیلی طولانیه.");

button.disabled=true;

try{

const{data,error}=await supabaseClient
.from("messages")
.insert({
sender_id:currentUser.id,
receiver_id:chatPartnerId,
body:body
})
.select(
"id,sender_id,receiver_id,body,created_at,is_read"
)
.single();

if(error)throw error;

input.value="";

appendChatMessage(data,true);

}catch(e){

console.error(e);

alert(
e.message||
"پیام ارسال نشد."
);

}finally{

button.disabled=false;

input.focus();
}
}

async function markChatMessagesRead(){

if(!chatPartnerId||!currentUser)return;

const{error}=await supabaseClient
.from("messages")
.update({
is_read:true
})
.eq("receiver_id",currentUser.id)
.eq("sender_id",chatPartnerId)
.eq("is_read",false);

if(error)
console.error("mark chat read:",error);
}

function subscribeChatRealtime(){

cleanupChatRealtime();

if(!currentUser||!chatPartnerId)return;

chatChannel=
supabaseClient
.channel(
`chat:${currentUser.id}:${chatPartnerId}:${Date.now()}`
)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages",
filter:`receiver_id=eq.${currentUser.id}`
},
async payload=>{

const message=payload.new;

if(
message.sender_id!==chatPartnerId
)
return;

if(
document.visibilityState!=="visible"||
currentPage!=="chat"
){

return;
}

if(
document.querySelector(
`[data-message-id="${message.id}"]`
)
){

return;
}

appendChatMessage(message,true);

await markChatMessagesRead();

}
)
.subscribe(status=>{

console.log(
"Chat realtime status:",
status
);

});
}

if(calendarMonth>12){

calendarMonth=1;
calendarYear++;
}

if(calendarMonth<1){

calendarMonth=12;
calendarYear--;
}

try{

renderCalendar();

}catch(e){

console.error(e);
}

setTimeout(()=>{

renderAppointments().catch(e=>{

console.error(e);

const box=$("appointmentsList");

if(box){

box.innerHTML=`
<div class="empty">
قرارهای این ماه قابل دریافت نیست.
</div>
`;
}
});

},0);
}

function renderCalendar(){

const title=$("monthTitle");
const ownerLabel=$("calendarOwnerLabel");
const grid=$("calendarGrid");

if(!title||!grid)
return;

title.textContent=
`${months[calendarMonth-1]} ${calendarYear}`;

if(ownerLabel){

ownerLabel.textContent=
ownCalendar
?
"تقویم من"
:
`تقویم ${calendarOwnerName}`;
}

const first=
jalaliDateToISO(
calendarYear,
calendarMonth,
1
);

const nextMonth=
calendarMonth===12
?
jalaliDateToISO(
calendarYear+1,
1,
1
)
:
jalaliDateToISO(
calendarYear,
calendarMonth+1,
1
);

const days=
jalaliMonthDays(
calendarYear,
calendarMonth
);

grid.innerHTML=
weekdays
.map(x=>`
<div class="weekday">
${x}
</div>
`)
.join("");

const[
gy,
gm,
gd
]=first.split("-").map(Number);

const saturdayIndex=
(
new Date(
Date.UTC(
gy,
gm-1,
gd
)
).getUTCDay()+1
)%7;

for(let i=0;i<saturdayIndex;i++){

grid.insertAdjacentHTML(
"beforeend",
`<div class="day empty"></div>`
);
}

const today=todayJalali();

const startTime=
Date.parse(first+"T00:00:00Z");

for(let day=1;day<=days;day++){

const date=
new Date(
startTime+
(day-1)*86400000
);

const iso=
date.toISOString().slice(0,10);

const el=
document.createElement("div");

el.className=
"day free"+
(
today.jy===calendarYear &&
today.jm===calendarMonth &&
today.jd===day
?
" today"
:
""
);

el.dataset.date=iso;

el.innerHTML=`
<strong>${day}</strong>
<small>آزاد</small>
`;

el.onclick=()=>openDate(
iso,
day,
window.calendarDayData?.[iso]||null
);

grid.appendChild(el);
}

window.calendarDayData={};

loadCalendarData(
first,
nextMonth
).catch(e=>{

console.error("loadCalendarData:",e);

});
}

async function loadCalendarData(first,nextMonth){

let data={};

try{

if(!ownCalendar&&calendarOwner){

const{data:d,error}=await withTimeout(

supabaseClient.rpc(
"get_friend_calendar",
{
p_friend_id:calendarOwner,
p_start_date:first,
p_end_date:nextMonth
}
),

10000
);

if(error)throw error;

(d||[]).forEach(x=>{

const date=String(x.date).slice(0,10);

data[date]={
...x,
is_booked:!!x.is_booked,
is_wish:!!x.is_wish
};

});

}else{

const{data:d,error}=await withTimeout(

supabaseClient
.from("bookings")
.select("date,partner_id")
.eq("user_id",currentUser.id)
.gte("date",first)
.lt("date",nextMonth),

10000
);

if(error)throw error;

(d||[]).forEach(x=>{

const date=String(x.date).slice(0,10);

data[date]={
is_booked:true,
is_wish:false,
partner_id:x.partner_id
};

});

}

window.calendarDayData=data;

Object.keys(data).forEach(iso=>{

const el=
document.querySelector(
`.day[data-date="${iso}"]`
);

if(!el)return;

const info=data[iso];

el.className=
"day "+
(
info?.is_booked
?
"booked"
:
info?.is_wish
?
"wish"
:
"free"
);

const j=isoToJalali(iso);

const today=todayJalali();

if(
today.jy===j.jy &&
today.jm===j.jm &&
today.jd===j.jd
){

el.classList.add("today");
}

el.innerHTML=`

<strong>
${j.jd}
</strong>

${
info?.is_booked
?
"<small>قرار</small>"
:
info?.is_wish
?
"<small>هم‌قرار</small>"
:
"<small>آزاد</small>"
}

`;
});

}catch(e){

console.error("Calendar data:",e);

const grid=$("calendarGrid");

if(grid){

const warning=
document.createElement("div");

warning.style.cssText=
"grid-column:1/-1;text-align:center;color:#aaa;font-size:9px;padding:8px 0";

warning.textContent=
"اطلاعات قرارها فعلاً دریافت نشد؛ تقویم همچنان قابل استفاده است.";

grid.appendChild(warning);
}
}
}

async function renderAppointments(){

const box=$("appointmentsList");

if(!box)return;

box.innerHTML=
`<div class="empty">
در حال دریافت...
</div>`;

let todayISO;
let nextISO;

try{

todayISO=
jalaliDateToISO(
calendarYear,
calendarMonth,
1
);

nextISO=
calendarMonth===12
?
jalaliDateToISO(
calendarYear+1,
1,
1
)
:
jalaliDateToISO(
calendarYear,
calendarMonth+1,
1
);

}catch(e){

box.innerHTML=
`<div class="empty">
خطا در محاسبه تاریخ‌ها.
</div>`;

return;
}

try{

const{data,error}=await withTimeout(

supabaseClient
.from("bookings")
.select("date,partner_id")
.eq("user_id",currentUser.id)
.gte("date",todayISO)
.lt("date",nextISO)
.order("date",{ascending:true}),

8000
);

if(error)throw error;

if(!data?.length){

box.innerHTML=
`<div class="empty">
برای این ماه قراری ثبت نشده.
</div>`;

return;
}

const ids=[
...new Set(
data
.map(x=>x.partner_id)
.filter(Boolean)
)
];

let profiles=[];

if(ids.length){

const{data:p,error:profileError}=await withTimeout(

supabaseClient
.from("profiles")
.select("id,display_name,username")
.in("id",ids),

8000
);

if(profileError)throw profileError;

profiles=p||[];
}

const map={};

profiles.forEach(
p=>map[p.id]=p
);

box.innerHTML=
data.map(x=>{

const p=map[x.partner_id];

return`

<div class="appointment">

<div class="appointment-date">
${jalaliDateLabel(x.date)}
</div>

<div class="appointment-text">
با
<b>
${escapeHtml(
p?.display_name||"کاربر"
)}
</b>
قرار داری.
</div>

<div class="appointment-status">
${
p?.username
?
"@"+escapeHtml(p.username)
:
""
}
 · تأیید شده
</div>

</div>
`;

}).join("");

}catch(e){

console.error(e);

box.innerHTML=
`<div class="empty">
${escapeHtml(
e.message||
"دریافت قرارها انجام نشد."
)}
</div>`;
}
}

/* =========================
انتخاب تاریخ
========================= */

function openDate(iso,day,info){

const p=$("datePanel");

if(!p)return;

p.classList.remove("hidden");

const j=isoToJalali(iso);

let html=`

<div class="card-title">
${j.jd}
${months[j.jm-1]}
${j.jy}
</div>
`;

if(info?.is_booked){

html+=`

<div class="date-info">
این تاریخ با
<b>
${escapeHtml(
info.partner_name||
"یک دوست"
)}
</b>
رزرو شده است.
</div>
`;

}else if(ownCalendar){

html+=`

<div class="date-info">
این تاریخ آزاده.
می‌تونی اعلام کنی که این روز دنبال هم‌قرار می‌گردی.
</div>

<br>

<button
class="primary"
onclick="createWish('${iso}')">
می‌خوام این روز برم بیرون
</button>
`;

}else{

html+=`

<div class="date-info">
این تاریخ در تقویم
${escapeHtml(calendarOwnerName)}
آزاد است.
</div>

<br>

<button
class="primary"
onclick="sendHangoutRequest('${iso}')">
درخواست قرار برای این تاریخ
</button>
`;
}

p.innerHTML=html;

p.scrollIntoView({
behavior:"smooth",
block:"nearest"
});
}

showLoading();

try{

const{error}=await withTimeout(

supabaseClient.rpc(
"create_hangout_request",

p_hangout_date:iso
}
),

);

if(error)throw error;

hideLoading();

alert("درخواست قرار ارسال شد.");

}catch(e){

e.message||
"ارسال درخواست انجام نشد."
);

}

}

async function respondHangout(requestId,accept){

showLoading();

try{

const{error}=await withTimeout(

supabaseClient.rpc(
"respond_to_hangout",
{
request_id:requestId,
accept_request:accept
}
),

12000
);

if(error)throw error;

hideLoading();

alert(
accept
?
"قرار قبول شد ❤️"
:
"درخواست رد شد."
);

await renderRequests();

}catch(e){

hideLoading();

alert(
e.message||
"عملیات انجام نشد."
);
}
}

/* =====================================================
اعلان‌ها
===================================================== */

function notificationActions(n){

const requestId=
n.related_id||
n.related_request_id||
null;

const wishDate=
n.related_date||
n.date||
null;

const actorId=
n.actor_id||
n.related_user_id||
null;

if(
n.type==="hangout_request" &&
requestId
){

return`

<div class="notification-actions">

<button
class="small-btn success-btn"
onclick="respondHangout('${requestId}',true)">
قبول
</button>

<button
class="small-btn danger-btn"
onclick="respondHangout('${requestId}',false)">
رد
</button>

</div>
`;
}

if(
n.type==="outing_wish" &&
actorId &&
wishDate
){

return`

<div class="notification-actions">

<button
class="small-btn success-btn"
onclick="respondWish('${actorId}','${wishDate}',true)">
می‌خوام باهاش برم
</button>

<button
class="small-btn danger-btn"
onclick="respondWish('${actorId}','${wishDate}',false)">
نه
</button>

</div>
`;
}

if(
n.type==="friend_request" &&
actorId
){

return`

<div class="notification-actions">

<button
class="small-btn success-btn"
onclick="acceptFriend('${actorId}')">
قبول دوستی
</button>

<button
class="small-btn danger-btn"
onclick="rejectFriend('${actorId}')">
رد
</button>

</div>
`;
}

return "";
}

/* =========================
شروع برنامه
========================= */

async function start(){

showLoading();

try{

if(!window.supabase)

throw new Error(
"کتابخانه Supabase بارگذاری نشده. اینترنت را بررسی کن."
);

supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const{data,error}=await withTimeout(
supabaseClient.auth.getSession(),
12000
);

if(error)throw error;

if(data?.session?.user){

currentUser=data.session.user;

await loadProfile();

renderApp();

}else{

renderAuth("login");
}

}catch(e){

console.error(e);

showFatalError(e);

}finally{

hideLoading();
}
}

start();
