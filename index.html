@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');    
    
:root{

--purple:#7557d9;

padding:0;    
}    
    
html{

}    
    
body{

button{

}    
    
.hidden{

}    
    
.loading{

inset:0;    
z-index:9999;

}

}

to{transform:rotate(360deg);}    
}    
    
.error-box{

padding:28px;

border-radius:28px;

}    
    
.error-box h2{

}    
    
.error-box p{

}

}

display:flex;    
justify-content:center;    
align-items:center;    
padding:22px;    
background:#fff;    
}

}

}    
    
.day.empty{

}    

.day.selected{

border-color:var(--purple);
color:#5b3fa3;
font-weight:800;
box-shadow:0 0 0 2px rgba(117,87,217,.12);
}

.day.selected strong{
font-size:15px;
font-weight:900;
} 
    
.day strong{    
font-size:13px;    
}    
    
.day small{

margin-top:3px;    
opacity:.7;    
}    
    
.appointments-title{    
display:flex;    
align-items:center;    
justify-content:space-between;    
}    
    
.appointment{

border:1px solid var(--border);

}    
    
.appointment-date{

font-size:11px;

margin-bottom:5px;    
}    
    
.appointment-text{    
font-size:12px;

}    
    
.appointment-status{

}    
    
.friend-item,

border-radius:19px;    
margin-bottom:10px;    
}    
    
.row{

align-items:center;    
justify-content:space-between;    
gap:10px;    
}    
    
.name{

}    
    
.username{

.danger-btn{

 .nav-badge{

 }

.date-info{

display:flex;    
flex-direction:column;

}

const faCalendar=    
new Intl.DateTimeFormat(    
"fa-IR-u-ca-persian-nu-latn",    
{    
year:"numeric",    
month:"numeric",    
day:"numeric"    
}    
);    
    
function gregorianToJalali(y,m,d){    
    
const parts=    
faCalendar.formatToParts(    
new Date(y,m-1,d)    
);    
    
const get=t=>    
Number(    
parts.find(x=>x.type===t)?.value    
);    
    
return{    
jy:get("year"),    
jm:get("month"),    
jd:get("day")    
};    
}    
    
const jalaliIsoCache=new Map();    
    
function jalaliDateToISO(jy,jm,jd){    
    
const key=`${jy}-${jm}-${jd}`;    
    
if(jalaliIsoCache.has(key))    
return jalaliIsoCache.get(key);    
    
let gy=jy+621;    
    
let guess=    
new Date(    
Date.UTC(    
gy,    
2,    
20    
)    
);    
    
for(let i=-10;i<=380;i++){    
    
const x=    
new Date(    
guess.getTime()+    
i*86400000    
);    
    
const j=    
gregorianToJalali(    
x.getUTCFullYear(),    
x.getUTCMonth()+1,    
x.getUTCDate()    
);    
    
if(    
j.jy===jy &&    
j.jm===jm &&    
j.jd===jd    
){    
    
const iso=    
`${x.getUTCFullYear()}-${String(    
x.getUTCMonth()+1    
).padStart(2,"0")}-${String(    
x.getUTCDate()    
).padStart(2,"0")}`;    
    
jalaliIsoCache.set(key,iso);    
    
return iso;    
}    
}    
    
throw new Error("تبدیل تاریخ انجام نشد.");    
}    
    
function isoToJalali(iso){    
    
const[    
y,    
m,    
d    
]=iso.slice(0,10)    
.split("-")    
.map(Number);    
    
return gregorianToJalali(y,m,d);    
}    
    
function jalaliMonthDays(y,m){    
    
if(m>=1&&m<=6)    
return 31;    
    
if(m>=7&&m<=11)    
return 30;    
    
const a=jalaliDateToISO(y,12,1);    
const b=jalaliDateToISO(y+1,1,1);    
    
return Math.round(    
(Date.parse(b)-Date.parse(a))/86400000    
);    
}    
    
function todayJalali(){    
    
const d=new Date();    
    
return gregorianToJalali(    
d.getFullYear(),    
d.getMonth()+1,    
d.getDate()    
);    
}

function jalaliDateLabel(iso){    
    
const j=isoToJalali(iso);    
    
return `${j.jd} ${months[j.jm-1]} ${j.jy}`;    
}    
    
function relativeTime(iso){    
    
if(!iso)return "";    
    
const d=new Date(iso);    
    
const s=    
Math.floor(    
(Date.now()-d.getTime())/1000    
);    
    
if(s<60)    
return "همین الان";    
    
if(s<3600)    
return `${Math.floor(s/60)} دقیقه پیش`;    
    
if(s<86400)    
return `${Math.floor(s/3600)} ساعت پیش`;    
    
if(s<604800)    
return `${Math.floor(s/86400)} روز پیش`;    
    
return d.toLocaleDateString("fa-IR");    
}    
    
function chatTime(iso){

return d.toLocaleTimeString("fa-IR",{

});    
}

if(!box)return;

data,
error
}=await supabaseClient
.from("messages")
.select(
"id,sender_id,receiver_id,body,created_at,is_read"
)
.or(

)
.order(
"created_at",
{
ascending:true
}
);

if(error){

box.innerHTML=`

<div class="chat-empty">    
${escapeHtml(error.message)}    
</div>    `;

return;
}

if(!data?.length){

box.innerHTML=`

<div class="chat-empty">    
هنوز پیامی بین شما رد و بدل نشده.    
<br>    
اولین پیام رو بفرست 👋

renderChatMessages(data);

function renderChatMessages(messages){

const box=$("chatMessages");

if(!box)return;

box.innerHTML="";

let lastDay="";

messages.forEach(message=>{

const day=
new Date(message.created_at)
.toLocaleDateString("fa-IR");

if(day!==lastDay){

const dateEl=
document.createElement("div");

dateEl.className="chat-date";

dateEl.textContent=day;

box.appendChild(dateEl);

lastDay=day;
}

appendChatMessage(message,false);
});

scrollChatToBottom();
}

function appendChatMessage(message,scroll=true){

const box=$("chatMessages");

if(!box)return;

const existing=
box.querySelector(
`[data-message-id="${message.id}"]`
);

if(existing)return;

const empty=
box.querySelector(".chat-empty");

if(empty)
empty.remove();

const mine=
message.sender_id===currentUser.id;

const row=
document.createElement("div");

row.className=
"chat-row "+
(mine?"mine":"theirs");

row.dataset.messageId=
message.id;

const bubble=
document.createElement("div");

bubble.className=
"chat-bubble "+
(mine?"mine":"theirs");

bubble.innerHTML=`

<div>    
${escapeHtml(message.body)}    
</div>    <div class="chat-time">    
${chatTime(message.created_at)}    
</div>    `;

row.appendChild(bubble);

box.appendChild(row);

if(scroll)
scrollChatToBottom();
}

function scrollChatToBottom(){

const box=$("chatMessages");

if(!box)return;

requestAnimationFrame(()=>{
box.scrollTop=box.scrollHeight;
});
}

async function sendChatMessage(){

const input=$("chatInput");
const button=$("chatSendButton");

if(!input||!chatPartnerId)
return;

const body=input.value.trim();

if(!body)return;

if(body.length>2000)
return alert("پیام خیلی طولانیه.");

button.disabled=true;

try{

const{
data,
error
}=await supabaseClient
.from("messages")
.insert({
sender_id:currentUser.id,
receiver_id:chatPartnerId,
body:body
})
.select(
"id,sender_id,receiver_id,body,created_at,is_read"
)
.single();

if(error)throw error;

input.value="";

appendChatMessage(
data,
true
);

}catch(e){

console.error(e);

alert(
e.message||
"پیام ارسال نشد."
);

}finally{

button.disabled=false;

input.focus();
}
}

async function markChatMessagesRead(){

if(!chatPartnerId||!currentUser)
return;

const{
error
}=await supabaseClient
.from("messages")
.update({
is_read:true
})
.eq("receiver_id",currentUser.id)
.eq("sender_id",chatPartnerId)
.eq("is_read",false);

if(error)
console.error(
"mark chat read:",
error
);
}

function subscribeChatRealtime(){

cleanupChatRealtime();

if(!currentUser||!chatPartnerId)
return;

chatChannel=
supabaseClient
.channel(
`chat:${currentUser.id}:${chatPartnerId}:${Date.now()}`
)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages",
filter:`receiver_id=eq.${currentUser.id}`
},
async payload=>{

const message=payload.new;

if(
message.sender_id!==chatPartnerId
)
return;

if(
currentPage!=="chat"
)
return;

if(
document.querySelector(
`[data-message-id="${message.id}"]`
)
)
return;

appendChatMessage(
message,
true
);

await markChatMessagesRead();

}
)
.subscribe(
status=>{
console.log(
"Chat realtime status:",
status
);
}
);
}

  function subscribeNotificationsRealtime(){

if(!currentUser)
return;

if(window.notificationChannel){
supabaseClient.removeChannel(
window.notificationChannel
);
}

window.notificationChannel=
supabaseClient
.channel(
`notifications:${currentUser.id}:${Date.now()}`
)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"notifications",
filter:`user_id=eq.${currentUser.id}`
},
async payload=>{

console.log(
"Notification realtime:",
payload
);

await getUnreadCount();

}
)
.subscribe(
status=>{
console.log(
"Notification realtime status:",
status
);
}
);

  }

calendarMonth===12

jalaliDateToISO(
calendarYear,
calendarMonth+1,
1
);

gm,
gd
]=first

(
new Date(
Date.UTC(
gy,
gm-1,
gd
)
).getUTCDay()+1
)%7;

for(let i=0;i<saturdayIndex;i++){

grid.insertAdjacentHTML(
"beforeend",
`<div class="day empty"></div>`
);

Date.parse(
first+"T00:00:00Z"
);

for(

day<=days;
day++

new Date(
startTime+
(day-1)*86400000
);

date
.toISOString()
.slice(0,10);

document.createElement("div");

"day free"+
(
today.jy===calendarYear &&
today.jm===calendarMonth &&
today.jd===day

" today"

""
);

${day}

آزاد

first,
nextMonth
)
.catch(e=>{

"loadCalendarData:",
e
);

});
}

async function renderNotifications(){

$("mainContent").innerHTML=`

<div class="card">    <div class="card-title">    
اعلان‌ها    
</div>    <div id="notificationsList">    
در حال دریافت...    
</div>    </div>    `;

const{
data,
error
}=await withTimeout(

supabaseClient
.from("notifications")
.select("*")
.eq(
"user_id",
currentUser.id
)
.order(
"created_at",
{
ascending:false
}
)
.limit(50),

12000
);

if(error){

$("notificationsList").innerHTML=`

<div class="empty">    
${escapeHtml(error.message)}    
</div>    `;

return;
}

if(!data?.length){

$("notificationsList").innerHTML=`

<div class="empty">    
اعلانی نداری.    
</div>    `;

return;
}

$("notificationsList").innerHTML=
data
.map(n=>`

<div    
class="notification-item ${    
n.is_read    
?    
""    
:    
"unread"    
}">    <div class="name">    
${escapeHtml(    
n.title||"اعلان"    
)}    
</div>    <div    
style="    
margin-top:7px;    
color:#666;    
font-size:12px;    
line-height:1.9">    ${escapeHtml(n.body||"")}

</div>    <div class="notification-time">    
${relativeTime(n.created_at)}    
</div>    ${notificationActions(n)}

</div>    `)
.join("");

await markNotificationsRead();
}

async function markNotificationsRead(){

const{
error
}=await supabaseClient
.from("notifications")
.update({
is_read:true
})
.eq(
"user_id",
currentUser.id
)
.eq(
"is_read",
false
);

if(error)
console.error(
"mark notifications:",
error
);
}

async function respondWish(
ownerId,
wishDate,
accept
){

ownerId=decodeAttr(ownerId);
wishDate=decodeAttr(wishDate);

showLoading();

try{

const{
error
}=await withTimeout(

supabaseClient.rpc(
"respond_to_outing_wish",
{
owner_id:ownerId,
wish_date:wishDate,
accept_request:accept
}
),

12000
);

if(error)throw error;

hideLoading();

alert(
accept
?
"قرار ثبت شد ❤️"
:
"درخواست رد شد."
);

await renderNotifications();

}catch(e){

hideLoading();

alert(
e.message||
"عملیات انجام نشد."
);
}
}

async function uploadAvatar(file){

if(!file)
return;

if(!file.type.startsWith("image/"))
return alert("لطفاً یک فایل تصویری انتخاب کن.");

if(file.size>5*1024*1024)
return alert("حجم عکس باید کمتر از ۵ مگابایت باشد.");

showLoading();

try{

const ext=
(
file.name.split(".").pop()||
"jpg"
)
.toLowerCase()
.replace(/[^a-z0-9]/g,"");

const path=
`${currentUser.id}/avatar-${Date.now()}.${ext}`;

const{
error:uploadError
}=await supabaseClient
.storage
.from("avatars")
.upload(
path,
file,
{
upsert:true,
contentType:file.type
}
);

if(uploadError)
throw uploadError;

const{
data:urlData
}=supabaseClient
.storage
.from("avatars")
.getPublicUrl(path);

const avatarUrl=urlData?.publicUrl;

if(!avatarUrl)
throw new Error(
"آدرس عکس ساخته نشد."
);

const{
error:updateError
}=await supabaseClient
.from("profiles")
.update({
avatar_url:avatarUrl
})
.eq("id",currentUser.id);

if(updateError)
throw updateError;

currentProfile.avatar_url=avatarUrl;

hideLoading();

await renderProfilePage();

alert("عکس پروفایل ذخیره شد ✅");

}catch(e){

hideLoading();

console.error(e);

alert(
e.message||
"آپلود عکس انجام نشد."
);

}
}

async function saveProfile(){

const displayName=
$("profileDisplayName")
?.value
.trim();

const city=
$("profileCity")
?.value
.trim();

const province=
$("profileProvince")
?.value
.trim();

const ageValue=
$("profileAge")
?.value
.trim();

const age=
ageValue?
Number(ageValue):
null;

const message=$("profileMessage");

if(!displayName){

if(message){

message.textContent=
"اسم نمایشی رو وارد کن.";

message.style.display="block";
}

return;
}

if(
age!==null&&
(
Number.isNaN(age)||
age<1||
age>120
)
){

if(message){

message.textContent=
"سن واردشده معتبر نیست.";

message.style.display="block";
}

return;
}

showLoading();

try{

const{
data,
error
}=await supabaseClient
.from("profiles")
.update({
display_name:displayName,
city:city||null,
province:province||null,
age:age
})
.eq("id",currentUser.id)
.select("*")
.single();

if(error)
throw error;

currentProfile=data;

hideLoading();

alert("پروفایل ذخیره شد ✅");

await renderApp();

}catch(e){

hideLoading();

console.error(e);

if(message){

message.textContent=
e.message||
"ذخیره پروفایل انجام نشد.";

message.style.display="block";
}

}
}

/* =========================
شروع
========================= */

async function start(){

showLoading();

try{

if(!window.supabase){

throw new Error(
"کتابخانه Supabase بارگذاری نشده. اینترنت را بررسی کن."
);

}

supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const{
data,
error
}=await withTimeout(
supabaseClient.auth.getSession(),
12000
);

if(error)throw error;

if(data?.session?.user){

currentUser=
data.session.user;

await loadProfile();

renderApp();

}else{

renderAuth("login");

}

}catch(e){

console.error(e);

showFatalError(e);

}finally{

hideLoading();

}
}

start();
