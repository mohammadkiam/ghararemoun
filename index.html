function escapeHtml(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function withTimeout(promise,ms=12000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>
      setTimeout(
        ()=>reject(
          new Error("اتصال به سرور بیش از حد طول کشید.")
        ),
        ms

/* =========================
   REAL PERSIAN DATE
   Uses browser Persian calendar
========================= */

const persianFormatter =
  new Intl.DateTimeFormat(
    "en-US-u-ca-persian",
    {
      year:"numeric",
      month:"numeric",
      day:"numeric"
    }
  );

function getPersianParts(date){

  const parts=persianFormatter.formatToParts(date);

  const result={};

  parts.forEach(p=>{
    if(p.type==="year")
      result.year=parseInt(p.value);

    if(p.type==="month")
      result.month=parseInt(p.value);

    if(p.type==="day")
      result.day=parseInt(p.value);
  });

  return result;
}

function localISO(date){

  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function todayPersian(){

  return getPersianParts(new Date());

}

function getPersianMonthDays(year,month){

  const result=[];

  const approxGregorianYear=year+621;

  const start=new Date(
    approxGregorianYear,
    1,
    20
  );

  const end=new Date(
    approxGregorianYear+1,
    4,
    1
  );

  for(
    let d=new Date(start);
    d<=end;
    d.setDate(d.getDate()+1)
  ){

    const p=getPersianParts(d);

    if(
      p.year===year &&
      p.month===month
    ){

      result.push({
        day:p.day,
        iso:localISO(d),
        date:new Date(d)
      });

    }
  }

  return result;
}

function isoToPersian(iso){

  const [y,m,d]=iso.split("-").map(Number);

  return getPersianParts(
    new Date(y,m-1,d)
  );

}

async function signup(){

  const password=$("password")?.value;

    return;
  }

  if(username.length<3){
    showMessage("نام کاربری حداقل ۳ حرف باشه.");
    return;
  }

  if(password.length<6){
    showMessage("رمز عبور حداقل ۶ کاراکتر باشه.");
    return;
  }

  showLoading();

  try{

    const fakeEmail=username+"@gharamoon.local";

      supabaseClient.auth.signUp({
        email:fakeEmail,
        password,

    if(data.session&&data.user){

      supabaseClient.rpc(
        "get_login_email",
        {p_username:username}
      )
    );

    if(emailError)throw emailError;

    if(!emailData)
      throw new Error("نام کاربری پیدا نشد.");

    const {data,error}=await withTimeout(
      supabaseClient.auth.signInWithPassword({
        email:emailData,
        password
      })
    );

    if(error)throw error;

    currentUser=data.user;

    await loadProfile();

    renderApp();

    hideLoading();

  }catch(error){

    hideLoading();
    renderAuth("login");

    showMessage(
      error.message||"ورود انجام نشد."
    );
  }
}

async function updateBadges(){

  if(!currentUser)return;

  try{

    const {
      count:notificationCount
    }=await supabaseClient
      .from("notifications")
      .select("*",{count:"exact",head:true})
      .eq("user_id",currentUser.id)
      .eq("is_read",false);


    const {
      count:hangoutCount
    }=await supabaseClient
      .from("hangout_requests")
      .select("*",{count:"exact",head:true})
      .eq("receiver_id",currentUser.id)
      .eq("status","pending");


    const {
      count:friendCount
    }=await supabaseClient
      .from("friendships")
      .select("*",{count:"exact",head:true})
      .eq("receiver_id",currentUser.id)
      .eq("status","pending");


    const totalRequests=
      (hangoutCount||0)+
      (friendCount||0);


    const notificationBadge=
      $("notificationBadge");

    if(notificationBadge){

      if((notificationCount||0)>0){

        notificationBadge.textContent=
          notificationCount>99
            ?"99+"
            :notificationCount;

        notificationBadge.classList.remove(
          "hidden"
        );

      }else{

        notificationBadge.classList.add(
          "hidden"
        );

      }

    }


    const requestBadge=
      $("requestBadge");

    if(requestBadge){

      if(totalRequests>0){

        requestBadge.textContent=
          totalRequests>99
            ?"99+"
            :totalRequests;

        requestBadge.classList.remove(
          "hidden"
        );

      }else{

        requestBadge.classList.add(
          "hidden"
        );

      }

    }


    const homeRequestBadge=
      $("homeRequestBadge");

    if(homeRequestBadge){

      if(totalRequests>0){

        homeRequestBadge.textContent=
          totalRequests>99
            ?"99+"
            :totalRequests;

        homeRequestBadge.classList.remove(
          "hidden"
        );

      }else{

        homeRequestBadge.classList.add(
          "hidden"
        );

      }

    }


    const homeNotificationBadge=
      $("homeNotificationBadge");

    if(homeNotificationBadge){

      if((notificationCount||0)>0){

        homeNotificationBadge.textContent=
          notificationCount>99
            ?"99+"
            :notificationCount;

        homeNotificationBadge.classList.remove(
          "hidden"
        );

      }else{

        homeNotificationBadge.classList.add(
          "hidden"
        );

      }

    }

  }catch(error){

    console.error(
      "Badge error:",

  }

async function changeMonth(direction){

  calendarMonth+=direction;

  if(calendarMonth>12){
    calendarMonth=1;
    calendarYear++;
  }

  if(calendarMonth<1){
    calendarMonth=12;
    calendarYear--;
  }

  await renderCalendar();
}


/* =========================
   LOAD CALENDAR DATA
========================= */

async function renderCalendar(){

  const title=$("monthTitle");
  const grid=$("calendarGrid");
  const appointments=$("appointments");
  const ownerText=$("calendarOwnerText");

  if(!title||!grid)return;

  title.textContent=
    `${getMonthName(calendarMonth)} ${calendarYear}`;

  ownerText.textContent=
    ownCalendar
      ?"تقویم من"
      :`تقویم ${calendarOwnerName}`;

  grid.innerHTML=`

    <div class="weekday">ش</div>
    <div class="weekday">ی</div>
    <div class="weekday">د</div>
    <div class="weekday">س</div>
    <div class="weekday">چ</div>
    <div class="weekday">پ</div>
    <div class="weekday">ج</div>

  `;

  const days=getPersianMonthDays(
    calendarYear,
    calendarMonth
  );

  if(!days.length){

    grid.innerHTML+=`
      <div
        class="empty"
        style="grid-column:1/-1">
        تقویم این ماه پیدا نشد.
      </div>
    `;

    return;
  }

  const firstDate=days[0].date;

  const firstIndex=
    (firstDate.getDay()+1)%7;

  for(
    let i=0;
    i<firstIndex;
    i++
  ){

    const empty=document.createElement("div");

    empty.className="day empty";

    grid.appendChild(empty);
  }

  let calendarData={};

  try{

    const start=days[0].iso;
    const end=days[days.length-1].iso;

    if(!ownCalendar){

      const {data,error}=await withTimeout(
        supabaseClient.rpc(
          "get_friend_calendar",
          {
            p_friend_id:calendarOwner,
            p_start_date:start,
            p_end_date:end
          }
        )
      );

      if(error)throw error;

      (data||[]).forEach(item=>{
        calendarData[item.date]=item;
      });

    }else{

      const {data,error}=await withTimeout(
        supabaseClient
          .from("bookings")
          .select("date,partner_id")
          .eq("user_id",currentUser.id)
          .gte("date",start)
          .lte("date",end)
      );

      if(error)throw error;

      (data||[]).forEach(item=>{
        calendarData[item.date]={
          is_booked:true,
          partner_id:item.partner_id
        };
      });

    }

  }catch(error){

    console.error(error);

    grid.innerHTML+=`
      <div
        class="empty"
        style="grid-column:1/-1">
        دریافت تقویم انجام نشد.
      </div>
    `;

    return;
  }

  const today=todayPersian();

  for(const item of days){

    const info=calendarData[item.iso];

    const el=document.createElement("div");

    el.className="day";

    if(
      today.year===calendarYear &&
      today.month===calendarMonth &&
      today.day===item.day
    ){
      el.classList.add("today");
    }

    if(info?.is_booked)
      el.classList.add("booked");
    else
      el.classList.add("free");

    if(info?.is_wish)
      el.classList.add("wish");

    el.innerHTML=`

      <strong>
        ${item.day}
      </strong>

      ${
        info?.is_booked
        ?
        `<small>قرار</small>`
        :
        info?.is_wish
        ?
        `<small>درخواست</small>`
        :
        `<small>آزاد</small>`
      }

    `;

    el.onclick=()=>openDate(
      item.iso,
      item.day,
      info
    );

    grid.appendChild(el);
  }

  await renderAppointments(
    calendarData,
    days
  );
}


/* =========================
   APPOINTMENTS UNDER CALENDAR
========================= */

async function renderAppointments(
  calendarData,
  days
){

  const box=$("appointments");

  if(!box)return;

  const booked=days
    .filter(x=>calendarData[x.iso]?.is_booked)
    .map(x=>({
      ...x,
      info:calendarData[x.iso]
    }));

  if(!booked.length){

    box.innerHTML=`

      <div class="card-title">
        قرارهای این ماه
      </div>

      <div class="empty">
        برای این ماه قراری ثبت نشده.
      </div>

    `;

    return;
  }

  const ids=[
    ...new Set(
      booked
        .map(x=>x.info.partner_id)
        .filter(Boolean)
    )
  ];

  let profiles=[];

  if(ids.length){

    const {data}=await supabaseClient
      .from("profiles")
      .select("id,display_name,username")
      .in("id",ids);

    profiles=data||[];
  }

  const map={};

  profiles.forEach(p=>{
    map[p.id]=p;
  });

  box.innerHTML=`

    <div class="card-title">
      قرارهای این ماه
    </div>

    ${
      booked.map(item=>{

        const person=
          map[item.info.partner_id];

        const name=
          person?.display_name ||
          "یک کاربر";

        return `

          <div class="appointment">

            <div class="appointment-date">

              <strong>
                ${item.day}
              </strong>

              <small>
                ${getMonthName(calendarMonth)}
              </small>

            </div>

            <div class="appointment-info">

              <strong>
                با ${escapeHtml(name)} قرار داری
              </strong>

              <span>
                ${
                  person?.username
                  ?"@"+escapeHtml(person.username)
                  :"قرار ثبت‌شده"
                }
              </span>

            </div>

          </div>

        `;

      }).join("")
    }

  `;
}

async function searchFriend(){

  const username=$("friendSearch")
    .value.trim()
    .toLowerCase();

  if(!username)return;

  const box=$("friendSearchResult");

  box.innerHTML=
    `<div class="empty">در حال جستجو...</div>`;

  const {data,error}=await supabaseClient
    .from("profiles")
    .select("id,display_name,username")
    .eq("username",username)
    .maybeSingle();

  if(error){

    box.innerHTML=
      `<div class="empty">${escapeHtml(error.message)}</div>`;

    return;
  }

  if(!data){

    box.innerHTML=
      `<div class="empty">کاربری پیدا نشد.</div>`;

    return;
  }

  if(data.id===currentUser.id){

    box.innerHTML=
      `<div class="empty">این خودتی 😄</div>`;

    return;
  }

  const {data:existing}=await supabaseClient
    .from("friendships")
    .select("*")
    .or(
      `and(requester_id.eq.${currentUser.id},receiver_id.eq.${data.id}),and(requester_id.eq.${data.id},receiver_id.eq.${currentUser.id})`
    )
    .maybeSingle();

    action=`
      <button
        class="small-btn purple-btn"
        onclick="sendFriendRequest('${data.id}')">
        افزودن
      </button>
    `;

  }else if(existing.status==="accepted"){

    action=`
      <span class="username">
        دوست شماست
      </span>
    `;

  }else if(existing.requester_id===currentUser.id){

    action=`
      <span class="username">
        درخواست ارسال شده
      </span>
    `;

  }else{

    action=`

      <button
        class="small-btn success-btn"
        onclick="acceptFriend('${data.id}')">
        قبول
      </button>

      <button
        class="small-btn danger-btn"
        onclick="rejectFriend('${data.id}')">
        رد
      </button>

    `;
  }

  box.innerHTML=`

    <div class="friend-item">

      <div class="row">

        <div>

          <div class="name">
            ${escapeHtml(data.display_name)}
          </div>

          <div class="username">
            @${escapeHtml(data.username)}
          </div>

        </div>

        <div>
          ${action}
        </div>

      </div>

}

  if(!confirm(
    "می‌خوای برای این تاریخ اعلام کنی که دنبال هم‌قرار می‌گردی؟"
  ))return;

  showLoading();

  try{

    const {error}=await withTimeout(
      supabaseClient
        .from("outing_wishes")
        .insert({
          user_id:currentUser.id,
          date:iso
        })
    );

    if(error)throw error;

    hideLoading();

    alert(
      "اعلامت ثبت شد و برای دوست‌های پذیرفته‌شده‌ات اطلاع‌رسانی می‌شود."
    );

    await renderCalendar();

  }catch(error){

    hideLoading();

    alert(
      error.message||
      "ثبت نشد."
    );
  }
}

async function loadHangoutRequests(){

  const box=$("requestsList");

  const {data,error}=await supabaseClient
    .from("hangout_requests")
    .select("*")
    .eq("receiver_id",currentUser.id)
    .eq("status","pending")
    .order("created_at",{ascending:false});

  if(error){

    box.innerHTML=
      `<div class="empty">${escapeHtml(error.message)}</div>`;

    return;
  }

  if(!data?.length){

    box.innerHTML=
      `<div class="empty">
        درخواست قرار جدیدی نداری.
      </div>`;

    return;
  }

  const ids=data.map(x=>x.requester_id);

  const {data:profiles}=await supabaseClient

    .select("id,display_name,username")
    .in("id",ids);

  const map={};

  box.innerHTML=data.map(r=>{

    const p=map[r.requester_id];
    const j=isoToPersian(r.date);

    return `

      <div class="request-item">

        <div class="name">
          ${escapeHtml(p?.display_name||"کاربر")}
        </div>

        <div class="username">

        <div class="date-info">

          ${j.day}
          ${getMonthName(j.month)}
          ${j.year}

          <br>

          درخواست قرار برای این تاریخ

        </div>

        <div class="notification-actions">

          <button
            class="small-btn success-btn"
            onclick="respondHangout(
              '${r.id}',
              true
            )">
            قبول
          </button>

          <button
            class="small-btn danger-btn"
            onclick="respondHangout(
              '${r.id}',
              false
            )">
            رد
          </button>

        </div>

      </div>

    `;

  }).join("");
}

/* =========================
   NOTIFICATIONS
========================= */

function notificationIcon(type){

  if(type==="friend_request")
    return "👥";

  if(type==="hangout_request")
    return "📅";

  if(type==="hangout_accepted")
    return "💜";

  if(type==="hangout_rejected")
    return "❌";

  if(type==="outing_wish")
    return "✨";

  return "🔔";
}

function formatNotificationTime(date){

  if(!date)return "";

  const d=new Date(date);

  const diff=
    Math.floor(
      (Date.now()-d.getTime())/60000
    );

  if(diff<1)return "همین الان";
  if(diff<60)return `${diff} دقیقه پیش`;

  const hours=Math.floor(diff/60);

  if(hours<24)return `${hours} ساعت پیش`;

  const days=Math.floor(hours/24);

  if(days<7)return `${days} روز پیش`;

  return d.toLocaleDateString("fa-IR");
}

async function renderNotifications(){

  $("mainContent").innerHTML=`

    <div class="card">

      <div class="card-title">
        اعلان‌ها 🔔
      </div>

      <div class="card-subtitle">
        اتفاقات مربوط به دوستی‌ها و قرارها اینجا ثبت می‌شوند.
      </div>

    </div>

    <div class="card">

      <div id="notificationsList">
        در حال دریافت...
      </div>

    </div>

  `;

  const {data,error}=await supabaseClient
    .from("notifications")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){

    $("notificationsList").innerHTML=
      `<div class="empty">${escapeHtml(error.message)}</div>`;

    return;
  }

  if(!data?.length){

    $("notificationsList").innerHTML=
      `<div class="empty">
        هنوز اعلانی نداری.
      </div>`;

    return;
  }

  $("notificationsList").innerHTML=
    data.map(n=>`

      <div
        class="notification-item ${
          n.is_read?"":"unread"
        }">

        <div class="notification-top">

          <div class="notification-icon">
            ${notificationIcon(n.type)}
          </div>

          <div class="notification-content">

            <div class="name">
              ${escapeHtml(n.title||"اعلان")}
            </div>

            <div class="notification-time">
              ${formatNotificationTime(n.created_at)}
            </div>

          </div>

        </div>

        <div class="notification-body">
          ${escapeHtml(n.body||"")}
        </div>

        ${notificationActions(n)}

      </div>

    `).join("");

  await markNotificationsRead();

  await updateBadges();
}

function notificationActions(n){

  if(
    n.type==="hangout_request" &&
    n.related_request_id
  ){

    return `

      <div class="notification-actions">

        <button
          class="small-btn success-btn"
          onclick="respondHangout(
            '${n.related_request_id}',
            true
          )">
          قبول
        </button>

        <button
          class="small-btn danger-btn"
          onclick="respondHangout(
            '${n.related_request_id}',
            false
          )">
          رد
        </button>

      </div>

    `;
  }

  if(
    n.type==="outing_wish" &&
    n.actor_id &&
    n.date
  ){

    return `

      <div class="notification-actions">

        <button
          class="small-btn success-btn"
          onclick="respondWish(
            '${n.actor_id}',
            '${n.date}',
            true
          )">
          می‌خوام باهاش برم
        </button>

        <button
          class="small-btn danger-btn"
          onclick="respondWish(
            '${n.actor_id}',
            '${n.date}',
            false
          )">
          نه
        </button>

      </div>

    `;
  }

  if(
    n.type==="friend_request" &&
    n.actor_id
  ){

    return `

      <div class="notification-actions">

        <button
          class="small-btn success-btn"
          onclick="acceptFriend(
            '${n.actor_id}'
          )">
          قبول دوستی
        </button>

        <button
          class="small-btn danger-btn"
          onclick="rejectFriend(
            '${n.actor_id}'
          )">
          رد
        </button>

      </div>

    `;
  }

  return "";
}

async function markNotificationsRead(){

  await supabaseClient
    .from("notifications")
    .update({is_read:true})
    .eq("user_id",currentUser.id)
    .eq("is_read",false);
}

    );

      error.message||

    );

/* =========================
   START
========================= */

async function start(){

  showLoading();

  try{

    if(!window.supabase){

      throw new Error(
        "کتابخانه Supabase بارگذاری نشده. اینترنت را بررسی کن."
      );

    }

    supabaseClient=
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const {data,error}=await withTimeout(
      supabaseClient.auth.getSession()
    );

    if(error)throw error;

    if(data?.session?.user){

      currentUser=data.session.user;

      await loadProfile();

      renderApp();

    }else{

      renderAuth("login");

    }

  }catch(error){

    console.error(error);

    showFatalError(error);

  }finally{

    hideLoading();

  }
}

start();
